# =====================================================================
# SERVICE REGISTRY  (harness-change-analyzer)
# =====================================================================
# The repo UNIVERSE the analyzer may search. Repo identity only — no branch
# (branch = target_branch from the story), no team/stream tag.
#
# Each repo declares:
#   stack          backend | angular-frontend | mobile-frontend
#   contract_paths one or more globs/paths to this repo's contract files.
#                  A repo may expose several contracts (its own API, a consumed
#                  client contract, versioned v1/v2, event schemas). All matching
#                  files are read (recall-first); the analyzer + human decide
#                  which matter.
#
# NO stored index: contracts are read fresh each run at target_branch
# (derive-on-read), parsed deterministically (no LLM), then a lexical shortlist
# picks ~10 candidates before the single Copilot reasoning call.
# =====================================================================

defaults:
  # default glob applied when a repo does not set its own contract_paths
  contract_paths:
    - "api/*.yaml"
    - "api/*.yml"

repos:
  inventory-service:
    stack: backend
    contract_paths:
      - "api/inventory.yaml"

  pricing-service:
    stack: backend
    contract_paths:
      - "api/pricing.yaml"

  book-service:
    stack: backend
    contract_paths:
      - "api/book.yaml"

# =====================================================================
# NOTES
# - Add a repo here to bring it into analysis scope. No branch, no stream.
# - contract_paths accepts exact paths or globs (api/*.yaml). For BCBSM repos
#   that expose multiple contracts, list them or use a glob.
# =====================================================================
