change_set:
  story: BCBSM-1234
  title: Add PLATINUM discount tier to pricing
  branch_default: main
  branch_overrides: {}
  description: 'Extend the pricing-service discountTier to support a new PLATINUM
    tier in

    addition to STANDARD and PREMIUM. inventory-service must apply the PLATINUM

    tier when computing effectivePrice, and book-service must reflect the resulting

    finalPrice. No breaking changes to existing tiers.


    Acceptance criteria:

    - pricing-service: discountTier enum includes PLATINUM.

    - inventory-service: effectivePrice correctly applies PLATINUM.

    - book-service: finalPrice reflects the PLATINUM-adjusted price.


    --- ATTACHMENTS ---


    [example-response.json]

    { "memberId": "M123", "name": "Jane Doe", "loyaltyTier": "GOLD" }


    '
  feature_branch: feature/BCBSM-1234-add-platinum-discount-tier-to-pricing
  status: APPROVED
  analysis:
    engine: copilot-sdk
    model: gpt-5.4-mini
    confidence: 0.91
    analyzed_refs:
      inventory-service: main
      pricing-service: main
      book-service: main
    all_repo_refs:
      inventory-service: main
      pricing-service: main
      book-service: main
    shortlist_widened: true
    shortlist_scores:
    - repo: inventory-service
      score: 1
      matched:
      - inventory
    - repo: pricing-service
      score: 1
      matched:
      - pricing
    - repo: book-service
      score: 0
      matched: []
    evidence:
    - pricing-service owns discountTier in api/pricing.yaml and is the provider contract
      being extended
    - discountTier enum changes from [STANDARD, PREMIUM] to include PLATINUM, which
      is additive/backward compatible
    - inventory-service explicitly consumes pricing-service and computes effectivePrice
      from discountTier
    - book-service exposes finalPrice sourced from inventory-service, but its own
      contract does not show direct discountTier usage
  provider:
    repo: pricing-service
    contract: api/pricing.yaml
    contract_version: v1
  consumers:
  - repo: inventory-service
    evidence: Inventory API says it consumes pricing-service and applies discountTier
      to compute effectivePrice; the added PLATINUM enum must be handled here.
  potentially_affected:
  - repo: book-service
    reason: Top consumer of inventory-service finalPrice; the downstream price shown
      to users may change, but no direct use of pricing-service's discountTier is
      shown.
  dependencies:
  - from: pricing-service
    to: inventory-service
  - from: inventory-service
    to: book-service
  contract_change:
    type: backward_compatible
  options:
    merge: manual
    contract_gate: required
    parallel: true
