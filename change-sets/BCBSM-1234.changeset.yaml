change_set:
  story: BCBSM-1234
  title: Add currency selection to book pricing
  branch_default: main
  branch_overrides: {}
  description: "Allow a book's price to be requested and returned in a chosen currency.\n\
    pricing-service adds a currency to its price response so prices can be returned\n\
    in a requested currency. inventory-service must pass the requested currency\n\
    through when computing the effective price, and book-service must accept a\ncurrency\
    \ parameter and surface the final price in that currency.\n\nAcceptance criteria:\n\
    - pricing-service returns the price in the requested currency.\n- inventory-service\
    \ forwards the requested currency and computes the effective\n  price in it.\n\
    - book-service accepts a currency parameter and shows the final price in it.\n\
    - Existing behaviour (no currency requested) defaults to USD.\n\n--- ATTACHMENTS\
    \ ---\n\n[example-response.json]\n{ \"memberId\": \"M123\", \"name\": \"Jane Doe\"\
    , \"loyaltyTier\": \"GOLD\" }\n\n"
  feature_branch: feature/BCBSM-1234-add-currency-selection-to-book-pricing
  status: APPROVED
  analysis:
    engine: copilot-sdk
    model: default
    confidence: 0.82
    clarify_threshold: 0.7
    clarifications_needed: []
    assumptions:
    - Assume currency is an optional request parameter named currency, defaulting
      to USD when omitted.
    - Assume the pricing-service change is additive/semantic rather than removing
      or renaming existing response fields.
    analyzed_refs:
      inventory-service: main
      pricing-service: main
      book-service: main
    all_repo_refs:
      inventory-service: main
      pricing-service: main
      book-service: main
    shortlist_widened: true
    shortlist_cap: 10
    shortlist_min_candidates: 3
    shortlist_scores:
    - repo: pricing-service
      score: 3
      matched:
      - book
      - price
      - pricing
    - repo: book-service
      score: 1
      matched:
      - book
    - repo: inventory-service
      score: 1
      matched:
      - book
    change_type: contract
    behavioural: true
    contract_only_insufficient: true
    change_type_reason: "story shows behavioural/semantic signals; a value's meaning\
      \ may change without an API-shape change, so contract-only evidence is insufficient\
      \ \u2014 verify functional impact per repo."
    code_signal_evidence:
    - consumer: inventory-service
      provider: pricing-service
      kind: webclient_call
      matched: /pricing/{bookId}
      file: src/main/java/com/bcbsm/inventory/PricingClient.java
      line: 18
      commit: a08862ff534eea3d4656b4ea1926d9df51182809
    - consumer: book-service
      provider: inventory-service
      kind: webclient_call
      matched: /inventory/{bookId}
      file: src/main/java/com/bcbsm/book/InventoryClient.java
      line: 18
      commit: 03f0fbfdd822b5a595b2a3f0d29c941e72fd95c9
    evidence:
    - pricing-service contract already exposes Price.currency but no request-time
      currency input, so the change is primarily semantic/additive.
    - inventory-service contract exposes effectivePrice and currency and it directly
      calls pricing-service, so it must propagate currency through the pricing hop.
    - book-service contract exposes finalPrice and currency and it directly calls
      inventory-service, so it must accept currency and pass it downstream.
  provider:
    repo: pricing-service
    contract: api/pricing.yaml
    contract_version: v1
  consumers:
  - repo: inventory-service
    evidence: Calls pricing-service via webclient to /pricing/{bookId}; must forward
      the requested currency when computing effectivePrice and currency.
  - repo: book-service
    evidence: Calls inventory-service via webclient to /inventory/{bookId}; must accept
      currency from its own API and surface the final priced result.
  potentially_affected: []
  dependencies:
  - from: inventory-service
    to: pricing-service
  - from: book-service
    to: inventory-service
  contract_change:
    type: backward_compatible
  options:
    merge: manual
    contract_gate: required
    parallel: true
